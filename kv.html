<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KV 卸载全景图 · AI 情报站</title>
<meta name="description" content="KV cache 卸载与分层缓存全景图：NVIDIA 与昇腾两条线的方案、场景、证据分级与坑。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
/* KV 子页专用样式：不改动 style.css，颜色一律走主题变量 */
.header-actions { display: flex; align-items: center; gap: 12px; }
.header-link { color: var(--ink-2); text-decoration: none; font-size: 13.5px; font-weight: 600; white-space: nowrap; transition: .16s; }
.header-link:hover { color: var(--accent); }

.kv-overview {
  margin-top: calc(var(--sp) * 3);
  padding: calc(var(--sp) * 3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    radial-gradient(900px 220px at 0% -30%, var(--accent-soft), transparent 70%),
    linear-gradient(180deg, var(--bg-soft), var(--card));
  box-shadow: var(--shadow);
  animation: rise .42s ease both;
}
.kv-eyebrow { margin: 0 0 var(--sp); font-size: 12px; letter-spacing: 1.2px; color: var(--ink-3); }
.kv-overview h2 { margin: 0; font-size: 21px; letter-spacing: .3px; }
.kv-sub { margin: 4px 0 0; font-size: 13px; color: var(--ink-3); }
.kv-totals { display: flex; flex-wrap: wrap; gap: var(--sp); margin-top: calc(var(--sp) * 2); }
.kv-total {
  padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--card); font-size: 13px; color: var(--ink-2);
}
.kv-total b { margin-left: 6px; font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; }
.kv-dist {
  display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--sp) * 1.5);
  margin-top: calc(var(--sp) * 2); padding-top: calc(var(--sp) * 2);
  border-top: 1px dashed var(--line);
}
.dist-label { font-size: 12px; color: var(--ink-3); }
.ev-dist-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.ev-dist-item b { font-variant-numeric: tabular-nums; color: var(--ink); }

/* 三组筛选：组间叠加(AND)，组内单选 */
.filters { flex-direction: column; align-items: flex-start; gap: 8px; }
.filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filter-label { font-size: 12px; color: var(--ink-3); min-width: 34px; }
.chip.kv-disabled { opacity: .38; cursor: not-allowed; }
.chip.kv-disabled:hover { border-color: var(--line); color: var(--ink-2); }

/* 双列 / 单列：用 minmax(0,1fr) 锁轨道，长文本不撑破窄屏 */
.kv-list {
  display: grid; grid-template-columns: minmax(0, 1fr);
  gap: calc(var(--sp) * 2); padding-bottom: calc(var(--sp) * 5);
}
@media (min-width: 820px) {
  .kv-list { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

.kv-card { display: flex; flex-direction: column; }
.kv-id { font-variant-numeric: tabular-nums; }
.badge-nvidia { background: var(--green-soft); color: var(--green); }
.badge-ascend { background: var(--red-soft); color: #ff8f8f; }
.badge-other { background: var(--accent-soft); color: var(--accent); }
.kv-engine { color: var(--ink-3); overflow-wrap: anywhere; min-width: 0; }
.origin-none { color: var(--ink-3); font-weight: 400; }
.ebadge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 6px;
  font-size: 12px; font-weight: 700; flex: none;
}
.ev-A { background: var(--green-soft); color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 40%, transparent); }
.ev-B { background: var(--blue-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.ev-C { background: var(--amber-soft); color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); }
.ev-D { background: var(--red-soft); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); }

.kv-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: calc(var(--sp) * 1.25); }
.kv-gain {
  margin: 0 0 calc(var(--sp) * 1.5);
  padding: calc(var(--sp) * 1.25) calc(var(--sp) * 2);
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 14.5px; font-weight: 600; color: var(--accent);
  overflow-wrap: anywhere; min-width: 0;
}
.gain-label { display: inline-block; margin-right: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .5px; opacity: .75; }

.pitfall { margin-top: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.pitfall > summary {
  list-style: none; cursor: pointer; user-select: none;
  padding: calc(var(--sp) * 1.25) calc(var(--sp) * 2);
  font-size: 13px; color: var(--ink-2);
}
.pitfall > summary::-webkit-details-marker { display: none; }
.pitfall > summary::before { content: "▸"; color: var(--accent); display: inline-block; margin-right: 8px; transition: transform .16s; }
.pitfall[open] > summary::before { transform: rotate(90deg); }
.pit-body { padding: 0 calc(var(--sp) * 2) calc(var(--sp) * 1.5); }
.pit-row { display: flex; gap: 8px; padding: 5px 0; font-size: 12.5px; border-top: 1px dashed var(--line); }
.pit-k { flex: none; width: 56px; color: var(--ink-3); }
.pit-v { color: var(--ink-2); overflow-wrap: anywhere; min-width: 0; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <span class="logo">🧠</span>
      <div>
        <h1>KV 卸载全景图</h1>
        <p class="tagline">分层缓存 · 两条线 · 带证据分级的方案地图</p>
      </div>
    </div>
    <div class="header-actions">
      <a class="header-link" href="index.html">← 回到情报站</a>
      <button id="theme-toggle" class="icon-btn" aria-label="切换主题" title="切换主题">◐</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="kv-overview" class="kv-overview" aria-label="全景统计"></section>

  <section class="toolbar">
    <div id="kv-filters" class="filters" role="tablist" aria-label="筛选"></div>
    <div class="search-box">
      <input id="kv-search" type="search" placeholder="搜索方案、引擎、收益、坑…" aria-label="搜索">
    </div>
  </section>

  <section id="kv-list" class="kv-list" aria-live="polite"></section>

  <section id="kv-empty" class="empty" hidden>
    <p>没有匹配的方案。</p>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>由团队整理 · 证据分级 A/B/C/D，只有 A/B 可「建议上」；数字与来源以原链接为准</p>
    <p class="muted">仓库：<a href="https://github.com/ZhengDeL/AI-Collect" target="_blank" rel="noopener">ZhengDeL/AI-Collect</a></p>
  </div>
</footer>

<script src="assets/kv.js"></script>
</body>
</html>
